name: Intraday Stock Scan (filtered watchlist)

on:
  schedule:
    # GitHub's scheduler is NOT precise — observed delays of hours during
    # testing, a known platform limitation (not something we can fix in
    # code). Running every 15 min across a WIDE window (well before open
    # to well after close) instead of once per hour on the dot greatly
    # improves the odds that at least one attempt lands close to each
    # actual trading hour. The script itself checks real IST time and
    # skips scanning if it's genuinely outside 9:15 AM-3:30 PM IST — so
    # extra attempts outside market hours just resolve pending signals
    # and exit quickly, they don't waste a live scan on stale data.
    - cron: '*/15 3-11 * * 1-5'
  workflow_dispatch: {}  # allows manual "Run workflow" trigger too

permissions:
  contents: write  # needed to commit docs/intraday_data.json and the signal log

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday scan and send alerts
        env:
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scan_intraday.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/intraday_data.json intraday_alerted_keys.json intraday_signal_log.json
          git diff --staged --quiet || git commit -m "Update intraday scan results [skip ci]"
          git push
